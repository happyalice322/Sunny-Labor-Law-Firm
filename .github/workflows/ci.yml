name: CI & Security Audit

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    name: Lint, Test & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Security Audit
        run: npm audit --audit-level=high || true

      - name: TypeScript & Lint Check
        run: npm run lint

      - name: Build Application
        run: npm run build
        env:
          VITE_FORMSPREE_FORM_ID: "placeholder"
          VITE_FORMSPREE_ENDPOINT: "https://formspree.io/f/placeholder"
